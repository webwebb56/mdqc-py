name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        # Newer interpreters on the two platforms that matter: Windows is where
        # the agent runs, Linux is the cheapest place to catch a language-level
        # break. Instrument PCs turn up with whatever Python was current when
        # they were built, so "we only test 3.11 and 3.12" is not a plan.
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        # Exclude `live` and `skyline` markers — both require external state
        # (running agent + Skyline install + raw files) that CI doesn't have.
        run: pytest -q -m "not live and not skyline"

  install-script:
    # The operator install path, end to end, on every Python an instrument PC
    # might have: fresh install, upgrade over the running agent, uninstall.
    # This is where a dependency without wheels for a new Python shows up
    # (winsdk did, on 3.13 and 3.14).
    name: install.ps1 / py${{ matrix.python-version }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Isolate the data folder
        shell: powershell
        run: |
          "MDQC_DATA_DIR=$env:RUNNER_TEMP\mdqc-data" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Set up Python
        id: py
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fresh install
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -Source . -InstallDir "$env:RUNNER_TEMP\mdqc" -Python "${{ steps.py.outputs.python-path }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Agent answers, single instance
        shell: powershell
        run: |
          $py = "$env:RUNNER_TEMP\mdqc\Scripts\python.exe"
          $url = & $py -m mdqc open --print-url
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Invoke-WebRequest -UseBasicParsing $url).StatusCode
          & $py -m mdqc start --no-tray
          Start-Sleep 5
          $agents = @(Get-CimInstance Win32_Process -Filter "Name like 'python%'" | Where-Object { $_.CommandLine -match 'mdqc run' -and $_.ExecutablePath -notmatch 'mdqc\\Scripts' })
          if ($agents.Count -ne 1) { Write-Error "expected one agent, found $($agents.Count)"; exit 1 }

      - name: Upgrade over the running agent
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -Source . -InstallDir "$env:RUNNER_TEMP\mdqc" -Python "${{ steps.py.outputs.python-path }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Uninstall
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -InstallDir "$env:RUNNER_TEMP\mdqc" -Uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path "$env:RUNNER_TEMP\mdqc") { Write-Error "environment left behind"; exit 1 }
          if (-not (Test-Path "$env:MDQC_DATA_DIR\config.toml")) { Write-Error "data folder not kept"; exit 1 }

  build-exe:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev + build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build PyInstaller binary
        run: python scripts/build.py --clean

      - name: Run selfcheck on built binary
        shell: pwsh
        run: dist\mdqc.exe selfcheck

      - name: Rename exe to include version
        shell: pwsh
        run: |
          Rename-Item -Path dist\mdqc.exe -NewName "mdqc-${{ steps.version.outputs.version }}.exe"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdqc-exe-${{ steps.version.outputs.version }}
          path: dist/mdqc-${{ steps.version.outputs.version }}.exe
          retention-days: 30

  release:
    name: GitHub Release
    needs: build-exe
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        shell: bash
        run: |
          version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No binary is attached. The frozen build still runs in `build-exe` as a
      # packaging check, but an unsigned 31 MB executable is the hardest thing
      # to get past a lab's IT review, and pip needs no exception from anyone.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MD QC Agent v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Installation

            Windows PowerShell, with Python 3.11 or newer installed:

            ```powershell
            py -3 -m venv C:\MassDynamics\mdqc
            C:\MassDynamics\mdqc\Scripts\pip install https://github.com/MassDynamics/md-qc/archive/refs/tags/v${{ steps.version.outputs.version }}.tar.gz
            C:\MassDynamics\mdqc\Scripts\mdqc run --foreground
            ```

            Calling the venv's `pip` and `mdqc` by path avoids activating it,
            so no PowerShell execution-policy change is needed.

            See [docs/INSTALL.md](https://github.com/MassDynamics/md-qc/blob/main/docs/INSTALL.md)
            for Skyline setup, configuration and the Windows service.
