name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        run: pytest -q

  build-installer:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev + build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build PyInstaller binary
        run: python scripts/build.py --clean

      - name: Run selfcheck on built binary
        shell: pwsh
        run: |
          dist\mdqc.exe selfcheck

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Provision NSSM (verified)
        shell: pwsh
        env:
          # nssm-2.24.zip SHA-256. Run `Get-FileHash nssm-2.24.zip -Algorithm SHA256`
          # against the official release zip and update this constant when bumping.
          # If left as TODO the provisioning step fails fast and the installer is
          # not built — that is intentional. See installer/README.md.
          EXPECTED_NSSM_SHA256: "TODO"
        run: |
          $url = "https://nssm.cc/release/nssm-2.24.zip"
          $zip = "$env:RUNNER_TEMP/nssm-2.24.zip"
          $extract = "$env:RUNNER_TEMP/nssm-extract"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $expected = $env:EXPECTED_NSSM_SHA256.ToLower()
          if ($expected -eq "todo") {
            Write-Error "EXPECTED_NSSM_SHA256 is TODO. Compute SHA256 of $url and pin it in ci.yml. Actual: $actual"
            exit 1
          }
          if ($actual -ne $expected) {
            Write-Error "NSSM zip SHA256 mismatch. expected=$expected actual=$actual"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          Copy-Item "$extract/nssm-2.24/win64/nssm.exe" -Destination installer/nssm.exe -Force
          Set-Content -Path installer/nssm.sha256 -Value (Get-FileHash installer/nssm.exe -Algorithm SHA256).Hash.ToLower()

      - name: Build installer
        run: python scripts/package.py --version ${{ steps.version.outputs.version }}

      - name: Upload installer (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mdqc-setup-py
          path: dist/installer/*.exe

  release:
    name: GitHub Release
    needs: build-installer
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: mdqc-setup-py
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
