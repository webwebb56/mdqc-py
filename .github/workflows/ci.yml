name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        # Newer interpreters on the two platforms that matter: Windows is where
        # the agent runs, Linux is the cheapest place to catch a language-level
        # break. Instrument PCs turn up with whatever Python was current when
        # they were built, so "we only test 3.11 and 3.12" is not a plan.
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Run tests
        # Exclude `live` and `skyline` markers — both require external state
        # (running agent + Skyline install + raw files) that CI doesn't have.
        run: pytest -q -m "not live and not skyline"

  install-script:
    # The operator install path, end to end, on every Python an instrument PC
    # might have: fresh install, upgrade over the running agent, uninstall.
    # This is where a dependency without wheels for a new Python shows up
    # (winsdk did, on 3.13 and 3.14).
    name: install.ps1 / py${{ matrix.python-version }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Isolate the data folder
        shell: powershell
        run: |
          "MDQC_DATA_DIR=$env:RUNNER_TEMP\mdqc-data" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Set up Python
        id: py
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fresh install
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -Source . -InstallDir "$env:RUNNER_TEMP\mdqc" -Python "${{ steps.py.outputs.python-path }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Agent answers, single instance
        shell: powershell
        run: |
          $py = "$env:RUNNER_TEMP\mdqc\Scripts\python.exe"
          $url = & $py -m mdqc open --print-url
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Invoke-WebRequest -UseBasicParsing $url).StatusCode
          & $py -m mdqc start --no-tray
          Start-Sleep 5
          $agents = @(Get-CimInstance Win32_Process -Filter "Name like 'python%'" | Where-Object { $_.CommandLine -match 'mdqc run' -and $_.ExecutablePath -notmatch 'mdqc\\Scripts' })
          if ($agents.Count -ne 1) { Write-Error "expected one agent, found $($agents.Count)"; exit 1 }

      - name: Upgrade over the running agent
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -Source . -InstallDir "$env:RUNNER_TEMP\mdqc" -Python "${{ steps.py.outputs.python-path }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Uninstall
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -InstallDir "$env:RUNNER_TEMP\mdqc" -Uninstall
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path "$env:RUNNER_TEMP\mdqc") { Write-Error "environment left behind"; exit 1 }
          if (-not (Test-Path "$env:MDQC_DATA_DIR\config.toml")) { Write-Error "data folder not kept"; exit 1 }

  build-installer:
    # MDQC-Setup-<version>.exe: MDQC with its own Python, for USB installs.
    # Built, installed, checked and uninstalled on a clean runner.
    name: Build setup program
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Build
        run: python scripts/build_installer.py

      # Signing turns on once the repository variable SIGNING_ACCOUNT is set
      # (with SIGNING_ENDPOINT, SIGNING_PROFILE and the AZURE_* secrets); see
      # installer/README.md. Until then the setup program is built unsigned.
      - name: Sign
        if: ${{ vars.SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\MDQC-Setup-${{ steps.version.outputs.version }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Install silently, check it runs, uninstall
        shell: pwsh
        run: |
          "MDQC_DATA_DIR=$env:RUNNER_TEMP\mdqc-data" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          $env:MDQC_DATA_DIR = "$env:RUNNER_TEMP\mdqc-data"
          $setup = "dist\MDQC-Setup-${{ steps.version.outputs.version }}.exe"
          $dir = "$env:RUNNER_TEMP\MDQC"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/CURRENTUSER", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir"
          $py = "$dir\python\python.exe"
          & $py -m mdqc version
          $url = $null
          foreach ($i in 1..45) { $url = & $py -m mdqc open --print-url 2>$null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 1 }
          if (-not $url) { Write-Error "the installed agent never answered"; exit 1 }
          (Invoke-WebRequest -UseBasicParsing $url).StatusCode
          if (-not (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).MassDynamicsQC) { Write-Error "no startup entry"; exit 1 }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          Start-Sleep 3
          if (Test-Path "$dir\python") { Write-Error "uninstall left the runtime behind"; exit 1 }
          if ((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).MassDynamicsQC) { Write-Error "startup entry left behind"; exit 1 }

      - name: Upload setup program
        uses: actions/upload-artifact@v4
        with:
          name: MDQC-Setup-${{ steps.version.outputs.version }}
          path: dist/MDQC-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 30

  release:
    name: GitHub Release
    needs: [build-installer, install-script]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        shell: bash
        run: |
          version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No binary is attached. The frozen build still runs in `build-exe` as a
      # packaging check, but an unsigned 31 MB executable is the hardest thing
      # to get past a lab's IT review, and pip needs no exception from anyone.
      - name: Download setup program
        uses: actions/download-artifact@v4
        with:
          name: MDQC-Setup-${{ steps.version.outputs.version }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MDQC-Setup-${{ steps.version.outputs.version }}.exe
          name: MD QC Agent v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Install from a USB stick (no Python or PowerShell needed)

            Download **MDQC-Setup-${{ steps.version.outputs.version }}.exe** below, copy it to the
            instrument PC (a USB stick is fine) and double-click it. It installs for the
            current user, starts the agent with a tray icon, and opens the dashboard.
            Running a newer setup program upgrades; remove it from *Settings > Apps*.

            ## Or install with PowerShell

            On the instrument PC, with [Python 3.11 or newer](https://www.python.org/downloads/)
            installed, open Windows PowerShell as the user who uses the PC and run:

            ```powershell
            Invoke-WebRequest -UseBasicParsing https://raw.githubusercontent.com/MassDynamics/md-qc/v${{ steps.version.outputs.version }}/scripts/install.ps1 -OutFile install.ps1
            powershell -ExecutionPolicy Bypass -File install.ps1
            ```

            The agent then runs in the background with a tray icon and starts at
            every login. Open it from the tray icon or *Start menu > Mass Dynamics QC >
            MD QC Dashboard*, and set it up under Settings. Re-run the same commands to
            upgrade; add `-Uninstall` to remove it.

            See [docs/INSTALL.md](https://github.com/MassDynamics/md-qc/blob/v${{ steps.version.outputs.version }}/docs/INSTALL.md)
            for Skyline setup, configuration and options.
