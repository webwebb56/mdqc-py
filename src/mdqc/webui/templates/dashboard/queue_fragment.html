<div class="grid">
  <div class="metric">
    <div class="label">Pending</div>
    <div class="value">{{ queue.pending }}</div>
  </div>
  <div class="metric">
    <div class="label">Uploading</div>
    <div class="value">{{ queue.uploading }}</div>
  </div>
  <div class="metric">
    <div class="label">Failed</div>
    <div class="value {% if queue.failed > 0 %}bad{% endif %}">{{ queue.failed }}</div>
  </div>
  <div class="metric">
    <div class="label">Completed (recent)</div>
    <div class="value">{{ queue.completed }}</div>
  </div>
</div>
