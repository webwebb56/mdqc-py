[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mdqc"
version = "0.1.3"
description = "MD Local QC Agent — Python port of the Rust mdqc-agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mass Dynamics", email = "engineering@massdynamics.com" }]
keywords = ["mass-spectrometry", "qc", "proteomics", "skyline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # CLI
    "typer>=0.12",

    # Config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # HTTP + retry
    "httpx>=0.27",
    "tenacity>=8.2",

    # File watching
    "watchdog>=4.0",

    # Process control
    "psutil>=5.9",

    # Logging
    "structlog>=24.1",
    "python-json-logger>=2.0",

    # Web UI
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "tomli-w>=1.0",

    # Tray + images
    "pystray>=0.19",
    "pillow>=10.2",

    # Windows-only runtime dependencies. The platform marker means pip will
    # silently skip them on macOS/Linux dev installs but install them by default
    # on Windows. Do NOT make these optional extras — every Windows deployment
    # needs both. pywin32 is required for the FILE_SHARE_NONE exclusive-open
    # check (see docs/AGENT_NOTES § Watcher); winsdk is required for toasts in
    # the tray process. Missing either silently breaks core functionality.
    "pywin32>=306; sys_platform == 'win32'",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",

    # mTLS deferred to v1.1, but the package is needed for the PFX→PEM split
    # (see docs/AGENT_NOTES § Future).
    "cryptography>=42.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "freezegun>=1.4",
    "tomli-w>=1.0",
]
build = [
    "pyinstaller>=6.5",
]

[project.scripts]
mdqc = "mdqc.cli:app"

[project.urls]
Homepage = "https://github.com/MassDynamics/mdqc-py"
Issues = "https://github.com/MassDynamics/mdqc-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mdqc"]

# ─── Tooling ────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["winsdk.*", "win32.*", "pywin32.*", "pystray.*", "watchdog.observers.winapi"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "windows_only: tests that require Windows (skipped elsewhere)",
    "skyline: tests that require a real SkylineCmd.exe install (opt-in)",
    "integration: cross-module tests (slower)",
    "parity: tests that compare Python output against Rust fixtures",
]

[tool.coverage.run]
source = ["src/mdqc"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
